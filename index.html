<!DOCTYPE html>
<html lang="en">
<head>

<title>Your Name — Web Developer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap bar">

<section id="projects"><div class="wrap"><h2>Projects</h2><div class="grid" id="projectList"></div></div></section>

<section class="contact" id="contact"><div class="wrap">
  <h2>Let's work together</h2>
  <a class="mail" id="mail"></a>

<script src="data.js"></script>
